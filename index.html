<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FENDYX - Acceso</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
     <link rel="stylesheet" href="css/components.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-bg">
  <div class="auth-card">
    <div class="auth-logo">
      <img id="authLogo" alt="Logo" style="display:none;max-width:90px;border-radius:14px;">
      <span id="authLogoFallback" class="logo-hex">⬡</span>
      <h1 id="authAppName">FENDYX</h1>
      <p class="auth-tagline">Tu super-app del futuro</p>
    </div>
    <div class="auth-tabs">
      <button class="tab active" id="tabLogin" onclick="switchAuthTab('login')">Iniciar Sesión</button>
      <button class="tab" id="tabRegister" onclick="switchAuthTab('register')">Crear Cuenta</button>
    </div>
    <form id="form-login" class="auth-form active" onsubmit="handleLogin(event)">
      <div class="input-group"><input type="email" id="loginEmail" placeholder="Correo electrónico" autocomplete="email" required></div>
      <div class="input-group password-group">
        <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" onclick="togglePassword('loginPassword',this)">👁</button>
      </div>
      <button type="submit" class="btn-primary" id="btnLogin">Entrar</button>
      <p class="auth-link" onclick="openRecover()">🔑 ¿Olvidaste tu contraseña?</p>
    </form>
    <form id="form-register" class="auth-form" onsubmit="handleRegister(event)">
      <div class="input-group"><input type="text" id="regName" placeholder="Nombre completo" autocomplete="name" required></div>
      <div class="input-group"><input type="email" id="regEmail" placeholder="Correo electrónico" autocomplete="email" required></div>
      <div class="input-group"><input type="number" id="regAge" placeholder="Edad (mínimo 18)" min="18" max="100" required></div>
      <div class="input-group password-group">
        <input type="password" id="regPassword" placeholder="Contraseña (mín. 6)" minlength="6" autocomplete="new-password" required>
        <button type="button" class="toggle-pass" onclick="togglePassword('regPassword',this)">👁</button>
      </div>
      <div class="input-group">
        <select id="regRole" onchange="showRoleFields()" required>
          <option value="">¿Qué tipo de cuenta?</option>
          <option value="user">👤 Usuario Normal</option>
          <option value="restaurant">🍽️ Restaurante / Local</option>
          <option value="delivery">🛵 Domiciliario</option>
          <option value="nightclub">🎵 Bar / Discoteca</option>
          <option value="remote_worker">💻 Trabajador Remoto</option>
        </select>
      </div>
      <div id="roleFields"></div>
      <label class="check-line"><input type="checkbox" id="regTerms" required> Acepto términos y confirmo +18</label>
      <button type="submit" class="btn-primary" id="btnRegister">Crear Cuenta</button>
    </form>
    <div id="authMessage" class="auth-message"></div>
  </div>
</div>

<!-- MODAL: Código de verificación de correo -->
<div id="modal-verify" class="modal hidden"><div class="modal-content">
  <h3>📧 Verifica tu correo</h3>
  <p class="dim">Escribe el código de 6 dígitos enviado a <b id="verifyEmailLabel"></b></p>
  <input type="text" id="verifyCode" class="otp-input" maxlength="6" inputmode="numeric" placeholder="••••••">
  <button class="btn-primary" onclick="confirmSignupCode()">Verificar y entrar</button>
  <button class="btn-secondary" onclick="resendSignupCode()">Reenviar código</button>
  <button class="btn-secondary" onclick="closeModal('modal-verify')">Cancelar</button>
</div></div>

<!-- MODAL: Recuperar contraseña (3 pasos) -->
<div id="modal-recover" class="modal hidden"><div class="modal-content">
  <div class="modal-head"><h3>🔑 Recuperar contraseña</h3><button class="modal-close" onclick="closeModal('modal-recover')">✕</button></div>
  <div id="recoverStep1">
    <p class="dim">Paso 1 de 3: ingresa tu correo</p>
    <input type="email" id="recoverEmail" class="input-full" placeholder="tu@email.com">
    <button class="btn-primary" onclick="recoverSendCode()">Enviar código</button>
  </div>
  <div id="recoverStep2" class="hidden">
    <p class="dim">Paso 2 de 3: código de 6 dígitos</p>
    <input type="text" id="recoverCode" class="otp-input" maxlength="6" inputmode="numeric" placeholder="••••••">
    <button class="btn-primary" onclick="recoverVerifyCode()">Verificar código</button>
    <button class="btn-secondary" onclick="recoverSendCode()">Reenviar código</button>
  </div>
  <div id="recoverStep3" class="hidden">
    <p class="dim">Paso 3 de 3: crea tu nueva contraseña</p>
    <input type="password" id="recoverNewPass" class="input-full" minlength="6" placeholder="Nueva contraseña (mín. 6)">
    <button class="btn-primary" onclick="recoverSavePass()">Guardar y entrar</button>
  </div>
</div></div>

<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
